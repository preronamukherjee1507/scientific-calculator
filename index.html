<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
        <style>
    /* ================================
       MAROON & GOLD SCIENTIFIC CALCULATOR
       ================================ */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(
                circle at top,
                #5a1628 0%,
                #2b0812 45%,
                #120307 100%
            );

        font-family: "Segoe UI", Arial, sans-serif;
        color: #fff;
    }


    /* Calculator body */

    .calculator {
        width: 410px;

        padding: 22px;

        background:
            linear-gradient(
                145deg,
                #64172d,
                #3d0b1a 55%,
                #250610
            );

        border: 1px solid #c89b3c;

        border-radius: 24px;

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.7),
            0 0 35px rgba(212, 175, 55, 0.15),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);

        position: relative;
    }


    /* Gold decorative line */

    .calculator::before {
        content: "";

        position: absolute;

        top: 0;
        left: 25px;
        right: 25px;

        height: 2px;

        background:
            linear-gradient(
                90deg,
                transparent,
                #d4af37,
                #f4d77a,
                #d4af37,
                transparent
            );

        border-radius: 50%;
    }


    /* Title */

    .title {
        text-align: center;

        font-size: 22px;

        margin-bottom: 16px;

        font-weight: 700;

        letter-spacing: 2px;

        color: #f5d77a;

        text-shadow:
            0 0 8px rgba(212, 175, 55, 0.35);
    }


    /* Display */

    .display {
        background:
            linear-gradient(
                145deg,
                #160409,
                #250711
            );

        border: 1px solid #9d7430;

        border-radius: 15px;

        padding: 16px;

        margin-bottom: 15px;

        min-height: 115px;

        display: flex;

        flex-direction: column;

        justify-content: flex-end;

        overflow: hidden;

        box-shadow:
            inset 0 0 20px rgba(0, 0, 0, 0.7),
            0 3px 10px rgba(0, 0, 0, 0.3);
    }


    .expression {
        color: #c9a95a;

        font-size: 15px;

        min-height: 25px;

        text-align: right;

        word-wrap: break-word;
    }


    .result {
        color: #fff8dc;

        font-size: 35px;

        font-weight: 500;

        text-align: right;

        overflow-x: auto;

        white-space: nowrap;

        text-shadow:
            0 0 8px rgba(255, 235, 160, 0.25);
    }


    /* DEG / RAD */

    .mode {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 13px;

        color: #f1d77b;

        font-size: 14px;

        font-weight: 600;
    }


    .mode button {
        background: #531326;

        border: 1px solid #c49a3a;

        color: #f4d77a;

        padding: 8px 14px;

        border-radius: 8px;

        cursor: pointer;

        transition: 0.2s;
    }


    .mode button:hover {
        background: #742039;

        border-color: #f0cd63;

        box-shadow:
            0 0 10px rgba(212, 175, 55, 0.25);
    }


    /* Button grid */

    .buttons {
        display: grid;

        grid-template-columns:
            repeat(5, 1fr);

        gap: 8px;
    }


    /* All buttons */

    button {
        border: 1px solid transparent;

        border-radius: 11px;

        min-height: 55px;

        font-size: 16px;

        font-weight: 500;

        cursor: pointer;

        background:
            linear-gradient(
                145deg,
                #6b1b31,
                #4b0f21
            );

        color: #fff7e0;

        transition:
            transform 0.12s,
            background 0.2s,
            box-shadow 0.2s,
            border-color 0.2s;
    }


    button:hover {
        transform: translateY(-2px);

        background:
            linear-gradient(
                145deg,
                #81223b,
                #5b1328
            );

        border-color: #9f7430;

        box-shadow:
            0 5px 12px rgba(0, 0, 0, 0.35),
            0 0 8px rgba(212, 175, 55, 0.12);
    }


    button:active {
        transform: scale(0.94);
    }


    /* Scientific functions */

    .function {
        background:
            linear-gradient(
                145deg,
                #531326,
                #3e0c1c
            );

        color: #e7c76a;
    }


    .function:hover {
        background:
            linear-gradient(
                145deg,
                #702039,
                #501125
            );
    }


    /* Operators */

    .operator {
        background:
            linear-gradient(
                145deg,
                #8c273f,
                #69182e
            );

        color: #ffe9a6;

        border-color: rgba(212, 175, 55, 0.25);
    }


    .operator:hover {
        background:
            linear-gradient(
                145deg,
                #a9334d,
                #7d1d35
            );

        border-color: #d4af37;
    }


    /* Constants */

    .constant {
        background:
            linear-gradient(
                145deg,
                #67203a,
                #4b132a
            );

        color: #f2d374;
    }


    .constant:hover {
        background:
            linear-gradient(
                145deg,
                #81264a,
                #5e1734
            );
    }


    /* Clear button */

    .danger {
        background:
            linear-gradient(
                145deg,
                #a32940,
                #78182e
            );

        color: #fff;
    }


    .danger:hover {
        background:
            linear-gradient(
                145deg,
                #c03851,
                #922039
            );

        border-color: #e2bd55;
    }


    /* Equals button */

    .equals {
        background:
            linear-gradient(
                145deg,
                #d4af37,
                #9b7420
            );

        color: #2a0a11;

        font-weight: 800;

        border: 1px solid #f3d36a;

        box-shadow:
            0 3px 10px rgba(212, 175, 55, 0.2);
    }


    .equals:hover {
        background:
            linear-gradient(
                145deg,
                #f0cf65,
                #bd9228
            );

        color: #21060c;

        box-shadow:
            0 5px 18px rgba(212, 175, 55, 0.35);
    }


    /* History */

    .history {
        margin-top: 16px;

        background:
            linear-gradient(
                145deg,
                #190409,
                #250711
            );

        border: 1px solid #684c20;

        border-radius: 12px;

        padding: 10px;

        max-height: 125px;

        overflow-y: auto;

        font-size: 13px;

        color: #d8bd6b;
    }


    .history-title {
        color: #f4d77a;

        margin-bottom: 6px;

        font-weight: 700;
    }


    .history-item {
        padding: 5px 0;

        border-bottom:
            1px solid #3c1520;
    }


    /* Scrollbars */

    .history::-webkit-scrollbar,
    .result::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }


    .history::-webkit-scrollbar-track,
    .result::-webkit-scrollbar-track {
        background: #1b050b;
    }


    .history::-webkit-scrollbar-thumb,
    .result::-webkit-scrollbar-thumb {
        background: #a37a29;

        border-radius: 10px;
    }


    /* Mobile */

    @media (max-width: 450px) {

        .calculator {
            width: 95%;

            padding: 16px;
        }

        button {
            min-height: 50px;

            font-size: 14px;
        }

        .result {
            font-size: 29px;
        }

        .title {
            font-size: 19px;
        }
    }

    </style>
</head>

<body>

<div class="calculator">

    <div class="title">Scientific Calculator</div>

    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <div class="mode">
        <span id="modeText">DEG</span>
        <button onclick="toggleMode()">Switch to RAD</button>
    </div>

    <div class="buttons">

        <!-- Row 1 -->
        <button class="danger" onclick="clearCalculator()">AC</button>
        <button onclick="backspace()">⌫</button>
        <button class="function" onclick="insert('(')">(</button>
        <button class="function" onclick="insert(')')">)</button>
        <button class="operator" onclick="insert('/')">÷</button>

        <!-- Row 2 -->
        <button class="function" onclick="insert('sin(')">sin</button>
        <button class="function" onclick="insert('cos(')">cos</button>
        <button class="function" onclick="insert('tan(')">tan</button>
        <button class="function" onclick="insert('sqrt(')">√</button>
        <button class="operator" onclick="insert('*')">×</button>

        <!-- Row 3 -->
        <button class="function" onclick="insert('asin(')">sin⁻¹</button>
        <button class="function" onclick="insert('acos(')">cos⁻¹</button>
        <button class="function" onclick="insert('atan(')">tan⁻¹</button>
        <button class="function" onclick="insert('log(')">log</button>
        <button class="operator" onclick="insert('-')">−</button>

        <!-- Row 4 -->
        <button class="function" onclick="insert('ln(')">ln</button>
        <button class="function" onclick="insert('factorial(')">x!</button>
        <button class="constant" onclick="insert('pi')">π</button>
        <button class="constant" onclick="insert('e')">e</button>
        <button class="operator" onclick="insert('+')">+</button>

        <!-- Row 5 -->
        <button onclick="insert('7')">7</button>
        <button onclick="insert('8')">8</button>
        <button onclick="insert('9')">9</button>
        <button class="function" onclick="insert('^')">xʸ</button>
        <button class="operator" onclick="insert('%')">%</button>

        <!-- Row 6 -->
        <button onclick="insert('4')">4</button>
        <button onclick="insert('5')">5</button>
        <button onclick="insert('6')">6</button>
        <button class="function" onclick="insert('Ans')">Ans</button>
        <button class="function" onclick="insert('1/')">1/x</button>

        <!-- Row 7 -->
        <button onclick="insert('1')">1</button>
        <button onclick="insert('2')">2</button>
        <button onclick="insert('3')">3</button>
        <button onclick="insert('0')">0</button>
        <button class="equals" onclick="calculate()">=</button>

        <!-- Row 8 -->
        <button onclick="insert('.')">.</button>
        <button onclick="insert('00')">00</button>
        <button onclick="insert('10^(')">10ˣ</button>
        <button onclick="insert('exp(')">eˣ</button>
        <button onclick="clearHistory()">H</button>

    </div>

    <div class="history" id="history">
        <div class="history-title">History</div>
    </div>

</div>


<script>

    let expression = "";
    let lastAnswer = 0;
    let degreeMode = true;

    const expressionDisplay = document.getElementById("expression");
    const resultDisplay = document.getElementById("result");
    const modeText = document.getElementById("modeText");

    function updateDisplay() {
        expressionDisplay.textContent = expression;
    }


    function insert(value) {
        expression += value;
        updateDisplay();
    }


    function clearCalculator() {
        expression = "";
        resultDisplay.textContent = "0";
        updateDisplay();
    }


    function backspace() {
        expression = expression.slice(0, -1);
        updateDisplay();
    }


    function toggleMode() {

        degreeMode = !degreeMode;

        modeText.textContent = degreeMode ? "DEG" : "RAD";

        document.querySelector(".mode button").textContent =
            degreeMode ? "Switch to RAD" : "Switch to DEG";
    }


    function factorial(n) {

        if (!Number.isFinite(n)) {
            throw new Error("Invalid factorial");
        }

        if (n < 0 || !Number.isInteger(n)) {
            throw new Error("Factorial requires a non-negative integer");
        }

        if (n > 170) {
            throw new Error("Number too large");
        }

        let result = 1;

        for (let i = 2; i <= n; i++) {
            result *= i;
        }

        return result;
    }


    function toRadians(x) {
        return degreeMode ? x * Math.PI / 180 : x;
    }


    function fromRadians(x) {
        return degreeMode ? x * 180 / Math.PI : x;
    }


    /*
       Convert calculator functions into JavaScript Math functions.
    */
    function prepareExpression(expr) {

        expr = expr
            .replace(/π/g, "pi")
            .replace(/\s+/g, "");

        expr = expr.replace(/Ans/g, `(${lastAnswer})`);

        expr = expr.replace(/\bpi\b/g, "Math.PI");
        expr = expr.replace(/\be\b/g, "Math.E");

        expr = expr.replace(
            /sin\(/g,
            "SIN("
        );

        expr = expr.replace(
            /cos\(/g,
            "COS("
        );

        expr = expr.replace(
            /tan\(/g,
            "TAN("
        );

        expr = expr.replace(
            /asin\(/g,
            "ASIN("
        );

        expr = expr.replace(
            /acos\(/g,
            "ACOS("
        );

        expr = expr.replace(
            /atan\(/g,
            "ATAN("
        );

        expr = expr.replace(
            /sqrt\(/g,
            "Math.sqrt("
        );

        expr = expr.replace(
            /log\(/g,
            "Math.log10("
        );

        expr = expr.replace(
            /ln\(/g,
            "Math.log("
        );

        expr = expr.replace(
            /exp\(/g,
            "Math.exp("
        );

        /*
           Convert ^ to JavaScript exponentiation.
        */
        expr = expr.replace(/\^/g, "**");

        /*
           Convert percentages.
        */
        expr = expr.replace(
            /(\d+(?:\.\d+)?)%/g,
            "($1/100)"
        );

        /*
           Convert factorial().
        */
        expr = expr.replace(
            /factorial\(/g,
            "FACTORIAL("
        );

        /*
           Handle 1/x.
        */
        expr = expr.replace(
            /1\/\(/g,
            "1/("
        );

        return expr;
    }


    function calculate() {

        if (!expression.trim()) {
            return;
        }

        try {

            let prepared = prepareExpression(expression);

            const SIN = x => Math.sin(toRadians(x));
            const COS = x => Math.cos(toRadians(x));
            const TAN = x => Math.tan(toRadians(x));

            const ASIN = x => fromRadians(Math.asin(x));
            const ACOS = x => fromRadians(Math.acos(x));
            const ATAN = x => fromRadians(Math.atan(x));

            const FACTORIAL = factorial;

            /*
               Evaluate the mathematical expression.
            */
            let answer = Function(
                "SIN",
                "COS",
                "TAN",
                "ASIN",
                "ACOS",
                "ATAN",
                "FACTORIAL",
                `"use strict"; return (${prepared});`
            )(
                SIN,
                COS,
                TAN,
                ASIN,
                ACOS,
                ATAN,
                FACTORIAL
            );

            if (!Number.isFinite(answer)) {
                throw new Error("Math error");
            }

            /*
               Avoid ugly floating-point artifacts.
            */
            answer = Number.parseFloat(
                answer.toPrecision(12)
            );

            lastAnswer = answer;

            resultDisplay.textContent = answer;

            addHistory(expression, answer);

        } catch (error) {

            resultDisplay.textContent = "Error";

            console.error(error);
        }
    }


    function addHistory(expr, answer) {

        const history = document.getElementById("history");

        const item = document.createElement("div");

        item.className = "history-item";

        item.textContent = `${expr} = ${answer}`;

        history.appendChild(item);
    }


    function clearHistory() {

        const history = document.getElementById("history");

        history.innerHTML =
            '<div class="history-title">History</div>';
    }


    /*
       Keyboard support.
    */
    document.addEventListener("keydown", function(event) {

        const key = event.key;

        if (
            /[0-9+\-*/().%^]/.test(key)
        ) {

            expression += key;

            updateDisplay();

            event.preventDefault();
        }

        else if (key === "Enter") {

            calculate();

            event.preventDefault();
        }

        else if (key === "Backspace") {

            backspace();

            event.preventDefault();
        }

        else if (key === "Escape") {

            clearCalculator();

            event.preventDefault();
        }
    });

</script>

</body>
</html>
